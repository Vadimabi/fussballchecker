<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Beispielprojekt - Aufgaben</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Aufgabenverwaltung</h1>
    <ul id="taskList">
        <!-- Aufgaben werden hier geladen -->
    </ul>
    <form id="addTaskForm">
        <input type="text" id="title" placeholder="Titel" required>
        <input type="text" id="description" placeholder="Beschreibung" required>
        <button type="submit">Hinzufügen</button>
    </form>
    <script src="script.js"></script>
</body>
</html>
